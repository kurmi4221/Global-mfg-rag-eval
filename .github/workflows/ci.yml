name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install (core + dev only; no API keys, no heavy extras)
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests (coverage gate is configured in pyproject.toml)
        run: uv run pytest --cov

      - name: Golden schema is in sync with the model
        run: |
          uv run python scripts/export_schema.py
          git diff --exit-code goldens/schema.json

  release-gate-selftest:
    # The strongest signal in this repo: prove the gate PASSES a clean pipeline
    # and BLOCKS a deliberately broken one, on every commit.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Gate must pass good and block broken
        run: uv run mfg-rag-eval selftest
      - name: Ledger of the broken run must verify (tamper-evidence)
        run: uv run mfg-rag-eval ledger-verify runs/candidate_broken/ledger.jsonl
      - name: Upload run artifacts (audit evidence)
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs
          path: runs/

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
