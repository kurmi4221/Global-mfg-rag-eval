[project]
name = "mfg-rag-eval"
version = "0.1.0"
description = "Evaluation and monitoring platform for manufacturing RAG applications (reference architecture + working POC)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# LLM-as-judge metrics (faithfulness, answer relevancy). Not needed for the gate demo.
judge = ["deepeval>=3.0", "ollama>=0.4"]
# Production trace store adapter.
tracing = ["langsmith>=0.2"]
# Only needed if you plug in a real RAG pipeline built on LangChain/Chroma.
rag = ["langchain-openai>=0.3", "langchain-chroma>=0.2"]

[project.scripts]
mfg-rag-eval = "mfg_rag_eval.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfg_rag_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/mfg_rag_eval"]
omit = ["src/mfg_rag_eval/metrics/deepeval_judge.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
